<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="layout :: body">
<div>
  <h2>Courses</h2>
  <table class="table table-hover">
    <thead><tr><th>ID</th><th>Code</th><th>Title</th></tr></thead>
    <tbody>
      <tr th:each="c : ${courses}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.code}"></td>
        <td th:text="${c.title}"></td>
      </tr>
    </tbody>
  </table>
</div>
</html>
